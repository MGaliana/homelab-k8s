# Single source of truth for lint checks: CI runs `pre-commit run --all-files`
# with this same file, so a green commit locally means a green CI job.
default_language_version:
  python: python3.13

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-added-large-files
      - id: detect-private-key
      - id: check-merge-conflict

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.109.4
    hooks:
      - id: terraform_fmt
      - id: terraform_validate
        # Use the committed lock file as-is; never rewrite it from a hook.
        args: [--tf-init-args=-lockfile=readonly]
      - id: terraform_tflint
        args: [--args=--config=__GIT_WORKING_DIR__/terraform/.tflint.hcl]

  - repo: https://github.com/ansible/ansible-lint
    rev: v26.11.0
    hooks:
      - id: ansible-lint
        language_version: python3.13
        # Same ansible-core as requirements-dev.txt.
        additional_dependencies: [ansible-core==2.22.0]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

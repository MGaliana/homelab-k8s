---
- name: Check whether node already joined
  ansible.builtin.stat:
    path: /etc/kubernetes/kubelet.conf
  register: worker_kubelet_conf

- name: Create a short-lived join command on the control plane
  ansible.builtin.command: kubeadm token create --ttl 10m --print-join-command
  delegate_to: "{{ groups['control_plane'][0] }}"
  register: worker_join_command
  changed_when: true
  no_log: true  # contains a bootstrap token
  when: not worker_kubelet_conf.stat.exists

- name: Run kubeadm join
  ansible.builtin.command: "{{ worker_join_command.stdout }}"
  args:
    creates: /etc/kubernetes/kubelet.conf
  no_log: true
  when: not worker_kubelet_conf.stat.exists

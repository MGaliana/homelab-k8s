---
- name: Get installed kubeadm version
  ansible.builtin.command: kubeadm version -o short
  register: control_plane_kubeadm_version
  changed_when: false

- name: Render kubeadm config
  ansible.builtin.template:
    src: kubeadm-config.yaml.j2
    dest: /etc/kubernetes/kubeadm-config.yaml
    mode: "0600"

- name: Run kubeadm init
  ansible.builtin.command: kubeadm init --config /etc/kubernetes/kubeadm-config.yaml
  args:
    creates: /etc/kubernetes/admin.conf

- name: Create kubeconfig dir for {{ ansible_user }}
  ansible.builtin.file:
    path: "/home/{{ ansible_user }}/.kube"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0700"

- name: Install kubeconfig for {{ ansible_user }}
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: "/home/{{ ansible_user }}/.kube/config"
    remote_src: true
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0600"

# Separate file on the controller: never touches ~/.kube/config.
- name: Fetch kubeconfig to the controller
  ansible.builtin.fetch:
    src: /etc/kubernetes/admin.conf
    dest: "{{ lookup('env', 'HOME') }}/.kube/homelab-k8s.conf"
    flat: true

- name: Restrict local kubeconfig permissions
  ansible.builtin.file:
    path: "{{ lookup('env', 'HOME') }}/.kube/homelab-k8s.conf"
    mode: "0600"
  delegate_to: localhost
  become: false

# --- CNI: Calico (operator install) ------------------------------------------

- name: Check whether Calico is installed
  ansible.builtin.command: kubectl get installation default
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: control_plane_calico_installed
  failed_when: false
  changed_when: false

- name: Calico resources manifest
  ansible.builtin.template:
    src: calico-resources.yaml.j2
    dest: /etc/kubernetes/calico-resources.yaml
    mode: "0644"

- name: Install Calico CRDs and operator
  ansible.builtin.command: >-
    kubectl create
    -f https://raw.githubusercontent.com/projectcalico/calico/{{ calico_version }}/manifests/{{ item }}
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  loop: [operator-crds.yaml, tigera-operator.yaml]
  when: control_plane_calico_installed.rc != 0
  changed_when: true

- name: Wait for Calico CRDs to be established
  ansible.builtin.command: kubectl wait --for=condition=Established crd/installations.operator.tigera.io crd/apiservers.operator.tigera.io --timeout=60s
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  when: control_plane_calico_installed.rc != 0
  changed_when: false

- name: Apply Calico Installation and APIServer
  ansible.builtin.command: kubectl apply -f /etc/kubernetes/calico-resources.yaml
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: control_plane_calico_apply
  changed_when: "'unchanged' not in control_plane_calico_apply.stdout"

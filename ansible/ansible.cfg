[defaults]
inventory = inventory/generated/hosts.yml
roles_path = roles
interpreter_python = auto_silent
stdout_callback = default
result_format = yaml
forks = 10

[ssh_connection]
# Lab VMs only: keep their host keys out of the main known_hosts.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o IdentitiesOnly=yes -o UserKnownHostsFile=~/.ssh/known_hosts_homelab -o StrictHostKeyChecking=accept-new
pipelining = True
